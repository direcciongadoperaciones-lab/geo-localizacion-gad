<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAD Operaciones - SUPERADMIN</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #000; border-bottom: 2px solid #D4AF37; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #D4AF37; margin: 0; font-size: 24px; }
        .btn-estadisticas { background: #D4AF37; color: #000; padding: 8px 15px; text-decoration: none; font-weight: bold; border-radius: 5px; }
        
        .contadores { display: flex; justify-content: space-around; background: #222; padding: 10px; border-bottom: 1px solid #333; }
        .cont { text-align: center; font-weight: bold; }
        .cont span { display: block; font-size: 20px; }
        .c-total { color: #fff; } .c-dispo { color: #28a745; } .c-serv { color: #dc3545; } .c-volv { color: #ffc107; }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        .panel-lista { width: 35%; background: #1a1a1a; overflow-y: auto; padding: 10px; border-right: 2px solid #333; box-sizing: border-box; }
        .panel-mapa { width: 65%; background: #333; }
        #map { height: 100%; width: 100%; }

        /* Estilo de la tabla de móviles */
        .tarjeta-movil { background: #000; border: 1px solid #D4AF37; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .tarjeta-movil h3 { margin: 0 0 5px 0; color: #D4AF37; font-size: 16px; }
        .tarjeta-movil p { margin: 2px 0; font-size: 13px; color: #ccc; }
        .whatsapp-link { color: #28a745; text-decoration: none; font-weight: bold; cursor: pointer; display: inline-block; margin-top: 5px; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .panel-lista { width: 100%; height: 45%; border-right: none; border-bottom: 2px solid #333; }
            .panel-mapa { width: 100%; height: 55%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>D.G.A.D.O - SUPERADMIN</h1>
        <a href="estadisticas.html" class="btn-estadisticas">📊 ESTADÍSTICAS</a>
    </div>

    <div class="contadores">
        <div class="cont c-total">TOTAL<span>45</span></div>
        <div class="cont c-dispo">DISPONIBLES<span>30</span></div>
        <div class="cont c-serv">EN SERVICIO<span>12</span></div>
        <div class="cont c-volv">VOLVIENDO<span>3</span></div>
    </div>

    <div class="main-container">
        <!-- Lista del 35% (PC) -->
        <div class="panel-lista" id="listaMoviles">
            <!-- Ejemplo de Tarjeta de Móvil (Esto lo generarás desde Firebase) -->
            <div class="tarjeta-movil">
                <h3>BASE GAD LA MATANZA</h3>
                <p><strong>A cargo:</strong> Of. Inspector Perez</p>
                <p><strong>Servicio:</strong> ALLANAMIENTO</p>
                <a class="whatsapp-link" onclick="abrirWhatsappContacto('1137899515')">📞 Contactar (11 3789-9515)</a>
            </div>
        </div>

        <!-- Mapa del 65% (PC) -->
        <div class="panel-mapa" id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Iniciar Mapa
        var map = L.map('map').setView([-34.6037, -58.3816], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Arreglo del mapa gris (InvalidateSize)
        setTimeout(() => { map.invalidateSize(); }, 500);
        window.addEventListener('resize', () => { map.invalidateSize(); });

        // Función para abrir WhatsApp sin 100 ventanas
        function abrirWhatsappContacto(telefonoFila) {
            const telLimpio = telefonoFila.replace(/\D/g,''); 
            let telFinal = telLimpio;
            if (!telFinal.startsWith('549')) { telFinal = '549' + telLimpio; }
            const url = `https://wa.me/${telFinal}`;
            window.open(url, 'whatsapp_gad'); // Abre siempre en la misma pestaña llamada 'whatsapp_gad'
        }
    </script>

    <!-- SCRIPT DE AUTO-UPDATE -->
    <script>
      let currentAppVersion = null;
      function checkVersion() {
        fetch('/version.json?t=' + new Date().getTime())
          .then(response => response.json())
          .then(data => {
            if (!currentAppVersion) {
              currentAppVersion = data.version;
            } else if (currentAppVersion !== data.version) {
              console.log("Nueva versión detectada. Actualizando...");
              location.reload(true);
            }
          }).catch(err => console.error("Error versión:", err));
      }
      setInterval(checkVersion, 15000);
    </script>
</body>
</html>
