<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEOLOCALIZACION GAD - Operativo</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --verde: #16a34a;
            --rojo: #dc2626;
            --azul: #2563eb;
            --amarillo: #fef9c3;
            --dorado: #d4af37;
            --fondo: #f8f9fa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--fondo);
            transition: background-color 0.3s ease;
        }

        body.estado-verde { background-color: #dcfce7; }
        body.estado-rojo { background-color: #fee2e2; }
        body.estado-amarillo { background-color: #fef9c3; }

        /* Cabecera adaptada con escudo y textos invertidos */
        .header {
            background: #000000;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-bottom: 3px solid var(--dorado);
            margin-bottom: 15px;
        }

        .header img {
            height: 70px;
            object-fit: contain;
            margin-right: 15px;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-text h1 {
            margin: 0;
            color: var(--dorado);
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .header-text h2 {
            margin: 0;
            color: var(--dorado);
            font-size: 14px;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        .container {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Formulario Operativo */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        #map {
            height: 180px;
            width: 100%;
            border-radius: 12px;
            z-index: 1;
            margin-bottom: 12px;
        }

        button {
            height: 52px;
            width: 100%;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
            margin-bottom: 10px;
        }
        button:active { transform: scale(0.98); }

        .btn-iniciar { background-color: var(--verde); }
        .btn-whatsapp { background-color: var(--azul); }
        .btn-finalizar { background-color: var(--rojo); }

        .info-texto {
            font-size: 14px;
            color: #555;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body class="estado-verde">

    <script>
        function checkVersion() {
            fetch('version.json?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    const localVersion = localStorage.getItem('appVersion');
                    if (!localVersion) localStorage.setItem('appVersion', data.version);
                    else if (localVersion !== data.version) {
                        localStorage.setItem('appVersion', data.version);
                        window.location.reload(true);
                    }
                }).catch(err => console.log('Error verificando versión:', err));
        }
        setInterval(checkVersion, 30000);
        checkVersion();
    </script>

    <!-- Cabecera con diseño institucional solicitado -->
    <div class="header">
        <!-- Reemplaza "image_8a9b2a.jpg" con la ruta real en tu servidor -->
      <img src="cabecera-gad.png" alt="Cabecera GEO-GAD">
        <div class="header-text">
            <h1>GEOLOCALIZACION GAD</h1>
            <h2>DIVISION OPERACIONES</h2>
        </div>
    </div>

    <div class="container">
        
        <div class="card" id="formularioCard">
            <div class="form-group">
                <label>Base Operativa (GAD)</label>
                <input type="text" id="baseOp" value="GAD LA PLATA" readonly style="background:#f1f1f1; font-weight:bold;">
            </div>
            <div class="form-group">
                <label>D.G.A.D.O</label>
                <input type="text" id="dgadO" required placeholder="Ej: D.G.A.D.O 2 MORON">
            </div>
            <div class="form-group">
                <label>Servicio</label>
                <input type="text" id="servicio" list="listaServicios" required placeholder="Escribí o seleccioná servicio">
                <datalist id="listaServicios">
                    <option value="ALLANAMIENTO">
                    <option value="MANIFESTACION">
                    <option value="CALABOZO">
                    <option value="OPERATIVO PREVENCION">
                    <option value="CONTROL VEHICULAR">
                    <option value="OTROS">
                </datalist>
            </div>
            <div class="form-group">
                <label>Lugar</label>
                <input type="text" id="lugar" required placeholder="Dirección del hecho">
            </div>
            <div class="form-group">
                <label>A Cargo</label>
                <input type="text" id="aCargo" required placeholder="Jerarquía y Apellido">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" id="telefono" required placeholder="Número de celular">
            </div>
            <div class="form-group">
                <label>Horario Inicio</label>
                <input type="text" id="horaInicio" value="TOCA INICIAR PARA CARGAR" readonly style="background:#f1f1f1; color: #555; font-weight:bold;">
            </div>
        </div>

        <div class="card" id="controles">
            <div id="map"></div>
            <div class="info-texto" id="statusText" style="margin-bottom: 10px;">ESTADO: LIBRE EN BASE</div>

            <button class="btn-iniciar" id="btnIniciar" onclick="cambiarEstado('rojo')">INICIAR SERVICIO</button>
            <button class="btn-whatsapp" id="btnWhatsapp" onclick="enviarWhatsapp()">ENVIAR WHATSAPP (PANORAMA)</button>
            <button class="btn-finalizar" id="btnFinalizar" onclick="finalizarServicio()" style="display:none;">FINALIZAR (VOLVER A BASE)</button>
        </div>
    </div>

    <!-- Firebase v8 Compat -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 🔴 ATENCIÓN: PEGA TU CONFIGURACIÓN DE FIREBASE AQUÍ 🔴
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            databaseURL: "https://TU_PROYECTO.firebaseio.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let opId = localStorage.getItem('opId');
        let baseId = localStorage.getItem('baseId') || 'GAD_LA_PLATA';
        let pibeId = localStorage.getItem('pibeId') || 'pibe_' + Math.floor(Math.random() * 100000);
        localStorage.setItem('pibeId', pibeId);
        
        const NUMERO_OFICINA = '5491137899515'; // Teléfono directo de la oficina (Ricky)

        const BASE_LAT = -34.6037; 
        const BASE_LNG = -58.3816;

        function initMap() {
            map = L.map('map').setView([-34.6037, -58.3816], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            // FIX PC / CELULAR REDIBUJADO
            setTimeout(() => { if(map) map.invalidateSize(); }, 500);
            window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));
            window.addEventListener('resize', () => map.invalidateSize());
        }
        initMap();

        function iniciarRastreo() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        miLat = position.coords.latitude;
                        miLng = position.coords.longitude;
                        
                        if (!marker) marker = L.marker([miLat, miLng]).addTo(map);
                        else marker.setLatLng([miLat, miLng]);
                        map.setView([miLat, miLng]);

                        if (estadoActual === 'amarillo') verificarDistanciaBase();
                    },
                    (error) => console.warn('Error GPS:', error),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );

                if (!transmisorInterval) {
                    transmisorInterval = setInterval(() => transmitirUbicacion(), 900000); // 15 mins para ahorrar
                }
            } else {
                alert("Geolocalización no soportada.");
            }
        }

        function transmitirUbicacion() {
            if (miLat !== 0 && estadoActual !== 'verde' && opId) {
                // Guarda en el nodo serviciosActivos/{baseId}/{opId}
                db.ref(`serviciosActivos/${baseId}/${opId}`).set({
                    GAD: document.getElementById('baseOp').value,
                    DGADO: document.getElementById('dgadO').value,
                    servicio: document.getElementById('servicio').value,
                    lugar: document.getElementById('lugar').value,
                    aCargo: document.getElementById('aCargo').value,
                    telefono: document.getElementById('telefono').value,
                    horaInicio: document.getElementById('horaInicio').value,
                    lat: miLat,
                    lng: miLng,
                    estado: estadoActual,
                    opId: opId,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function verificarDistanciaBase() {
            if (calcularDistancia(miLat, miLng, BASE_LAT, BASE_LNG) < 150) {
                alert("Has llegado a la base. Estado restablecido a LIBRE.");
                limpiarServicio();
            }
        }

        function cambiarEstado(nuevoEstado) {
            estadoActual = nuevoEstado;
            document.body.className = 'estado-' + nuevoEstado;

            if (nuevoEstado === 'rojo') {
                if(!document.getElementById('dgadO').value || !document.getElementById('servicio').value || !document.getElementById('lugar').value || !document.getElementById('aCargo').value || !document.getElementById('telefono').value) {
                    alert("Complete todos los campos obligatorios para iniciar.");
                    document.body.className = 'estado-verde';
                    estadoActual = 'verde';
                    return;
                }

                if(!opId) {
                    opId = 'OP-' + Date.now();
                    localStorage.setItem('opId', opId);
                    document.getElementById('horaInicio').value = new Date().toLocaleString('es-AR');
                }

                document.getElementById('btnIniciar').style.display = 'none';
                document.getElementById('btnFinalizar').style.display = 'block';
                document.getElementById('statusText').innerText = 'ESTADO: EN SERVICIO (ROJO)';
                
                document.getElementById('formularioCard').style.pointerEvents = 'none';
                document.getElementById('formularioCard').style.opacity = '0.7';

                iniciarRastreo();
                setTimeout(transmitirUbicacion, 1000); 

            } else if (nuevoEstado === 'amarillo') {
                document.getElementById('statusText').innerText = 'ESTADO: VOLVIENDO A BASE (AMARILLO)';
                transmitirUbicacion(); 
            }
        }

        function enviarWhatsapp(esFinalizacion = false) {
            let gad = document.getElementById('baseOp').value;
            let dgadO = document.getElementById('dgadO').value;
            let servicio = document.getElementById('servicio').value;
            let lugar = document.getElementById('lugar').value;
            let aCargo = document.getElementById('aCargo').value;
            let telefono = document.getElementById('telefono').value;
            let horaInicio = document.getElementById('horaInicio').value;
            
            let tituloMensaje = esFinalizacion ? "*FINALIZADO*" : "*GAD*";
            let mensajeOficina = `${tituloMensaje}\nD.G.A.D.O: ${dgadO}\nSERVICIO: ${servicio}\nLUGAR: ${lugar}\nA CARGO: ${aCargo}\nTEL: ${telefono}\nHORARIO: ${horaInicio}\nUBICACION: https://www.google.com/maps?q=${miLat},${miLng}`;
            
            // BLINDAJE WHATSAPP: Una sola pestaña, contacto fijo a la oficina de Ricky
            let urlOficina = `https://wa.me/${NUMERO_OFICINA}?text=${encodeURIComponent(mensajeOficina)}`;
            window.open(urlOficina, 'whatsapp_gad'); 
        }

        function finalizarServicio() {
            if(confirm("¿Estás seguro que deseas finalizar el servicio y regresar a base?")) {
                enviarWhatsapp(true); 
                cambiarEstado('amarillo');
                document.getElementById('btnFinalizar').style.display = 'none';
            }
        }

        function limpiarServicio() {
            if(opId) {
                db.ref(`serviciosActivos/${baseId}/${opId}`).remove();
                localStorage.removeItem('opId');
                opId = null;
            }
            
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (transmisorInterval) clearInterval(transmisorInterval);
            
            transmisorInterval = null;
            watchId = null;
            estadoActual = 'verde';

            document.body.className = 'estado-verde';
            document.getElementById('btnIniciar').style.display = 'block';
            document.getElementById('btnFinalizar').style.display = 'none';
            document.getElementById('statusText').innerText = 'ESTADO: LIBRE EN BASE';
            
            document.getElementById('formularioCard').style.pointerEvents = 'auto';
            document.getElementById('formularioCard').style.opacity = '1';
            document.getElementById('horaInicio').value = "TOCA INICIAR PARA CARGAR";
        }        initMap();

        // Rastreo optimizado para batería: Intervalo de 15 minutos (900000 ms) para transmisión background
        function iniciarRastreo() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        miLat = position.coords.latitude;
                        miLng = position.coords.longitude;
                        
                        if (!marker) marker = L.marker([miLat, miLng]).addTo(map);
                        else marker.setLatLng([miLat, miLng]);
                        map.setView([miLat, miLng]);

                        if (estadoActual === 'amarillo') verificarDistanciaBase();
                    },
                    (error) => console.warn('Error GPS:', error),
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                );

                if (!transmisorInterval) {
                    // Transmite la ubicación a Firebase cada 15 minutos para ahorrar batería
                    transmisorInterval = setInterval(() => {
                        transmitirUbicacion();
                    }, 900000); 
                }
            } else {
                alert("Geolocalización no soportada.");
            }
        }

        function transmitirUbicacion() {
            if (miLat !== 0 && estadoActual !== 'verde') {
                db.ref('operaciones/' + pibeId).set({
                    base: document.getElementById('baseOp').value,
                    dgado: document.getElementById('dgado').value,
                    servicio: document.getElementById('tipoServicio').value,
                    aCargo: document.getElementById('aCargo').value,
                    telefono: document.getElementById('telefono').value,
                    lat: miLat,
                    lng: miLng,
                    estado: estadoActual,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function verificarDistanciaBase() {
            const distancia = calcularDistancia(miLat, miLng, BASE_LAT, BASE_LNG);
            if (distancia < 150) {
                alert("Has llegado a la base. Estado restablecido a LIBRE.");
                limpiarServicio();
            }
        }

        function cambiarEstado(nuevoEstado) {
            estadoActual = nuevoEstado;
            document.body.className = 'estado-' + nuevoEstado;

            if (nuevoEstado === 'rojo') {
                // Validación del formulario
                if(!document.getElementById('dgado').value || !document.getElementById('aCargo').value) {
                    alert("Complete D.G.A.D.O y A Cargo para iniciar.");
                    document.body.className = 'estado-verde';
                    estadoActual = 'verde';
                    return;
                }

                document.getElementById('btnIniciar').style.display = 'none';
                document.getElementById('btnFinalizar').style.display = 'block';
                document.getElementById('statusText').innerText = 'ESTADO: EN SERVICIO (ROJO)';
                
                // Deshabilitar inputs para no cambiarlos en pleno servicio
                document.getElementById('formularioCard').style.pointerEvents = 'none';
                document.getElementById('formularioCard').style.opacity = '0.7';

                iniciarRastreo();
                setTimeout(transmitirUbicacion, 1000); // Primer envío inmediato

            } else if (nuevoEstado === 'amarillo') {
                document.getElementById('statusText').innerText = 'ESTADO: VOLVIENDO A BASE (AMARILLO)';
                transmitirUbicacion(); // Avisar al admin que está volviendo
            }
        }

        function enviarWhatsapp(esFinalizacion = false) {
            let base = document.getElementById('baseOp').value;
            let dgado = document.getElementById('dgado').value;
            let servicio = document.getElementById('tipoServicio').value;
            let aCargo = document.getElementById('aCargo').value;
            
            let mensaje = esFinalizacion 
                ? `*FINALICÉ SERVICIO*%0A${base}%0ADGADO: ${dgado}%0AServicio: ${servicio}%0AA Cargo: ${aCargo}%0AUbicación actual: https://maps.google.com/?q=${miLat},${miLng}`
                : `*REPORTE OPERATIVO*%0A${base}%0ADGADO: ${dgado}%0AServicio: ${servicio}%0AA Cargo: ${aCargo}%0AUbicación actual: https://maps.google.com/?q=${miLat},${miLng}`;
            
            let url = `https://api.whatsapp.com/send?text=${mensaje}`;
            window.open(url, 'whatsapp_pibe'); // Blindaje: siempre usa la misma pestaña
        }

        function finalizarServicio() {
            if(confirm("¿Estás seguro que deseas finalizar el servicio y regresar a base?")) {
                enviarWhatsapp(true); // Manda el WA de finalizado automático
                cambiarEstado('amarillo');
                document.getElementById('btnFinalizar').style.display = 'none';
            }
        }

        function limpiarServicio() {
            db.ref('operaciones/' + pibeId).remove();
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (transmisorInterval) clearInterval(transmisorInterval);
            
            transmisorInterval = null;
            watchId = null;
            estadoActual = 'verde';

            document.body.className = 'estado-verde';
            document.getElementById('btnIniciar').style.display = 'block';
            document.getElementById('btnFinalizar').style.display = 'none';
            document.getElementById('statusText').innerText = 'ESTADO: LIBRE EN BASE';
            
            // Habilitar inputs de nuevo
            document.getElementById('formularioCard').style.pointerEvents = 'auto';
            document.getElementById('formularioCard').style.opacity = '1';
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                miLat = pos.coords.latitude;
                miLng = pos.coords.longitude;
                map.setView([miLat, miLng], 15);
                if(!marker) marker = L.marker([miLat, miLng]).addTo(map);
                else marker.setLatLng([miLat, miLng]);
            }, err => console.log(err), {enableHighAccuracy: true});
        }
    </script>
    <script>
  // SISTEMA DE AUTO-UPDATE GAD
  let currentAppVersion = null;
  
  function checkVersion() {
    // Agregamos un timestamp para burlar cualquier caché
    fetch('/version.json?t=' + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        if (!currentAppVersion) {
          currentAppVersion = data.version; // Primer carga
        } else if (currentAppVersion !== data.version) {
          console.log("Nueva versión detectada. Actualizando...");
          location.reload(true); // Recarga forzada
        }
      })
      .catch(err => console.error("Error buscando actualización:", err));
  }

  // Chequea cada 15 segundos
  setInterval(checkVersion, 15000);
</script>
