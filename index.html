<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAD - 45 Bases</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0}
#map{height:100vh}
.header{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:999;background:#0a1931;color:#fff;padding:10px 20px;border-radius:10px;font-weight:bold;font-family:sans-serif}
</style>
</head>
<body>
<div class="header">GAD - 45 BASES OPERATIVAS</div>
<div id="map"></div>
<script>
const map=L.map('map').setView([-36.5,-60],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
fetch('BASES_GAD_2026.kml').then(r=>r.text()).then(t=>{
const d=new DOMParser().parseFromString(t,'text/xml');
const p=d.getElementsByTagName('Placemark');
let b=[];
for(let x of p){
let c=x.getElementsByTagName('coordinates')[0];if(!c)continue;
let co=c.textContent.trim().split(',');
let n=x.getElementsByTagName('name')[0]?.textContent||'GAD';
L.circleMarker([+co[1],+co[0]],{radius:8,color:'#fff',fillColor:'#ff0000',fillOpacity:1,weight:2}).addTo(map).bindPopup(n);
b.push([+co[1],+co[0]])
}
if(b.length)map.fitBounds(b,{padding:[40,40]})
})
</script>
</body>
</html>
